name: Build Release Candidate

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and verify backend
        run: |
          python -m pip install -r backend/requirements.txt
          python -m compileall backend
          python -m unittest
      - name: Install and verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run test
          npm run lint
          npm run build
      - name: Package release candidate
        run: python scripts/package_release.py
      - name: Upload package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: yunxun-release-candidate
          path: |
            dist/release/yunxun-1.0.0.zip
            dist/release/yunxun-1.0.0.zip.sha256
          retention-days: 14
